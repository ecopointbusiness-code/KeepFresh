<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KeepFresh household announcement</title></head>
<body style="margin:0;padding:24px 12px;background:#f4f7f6;font-family:Arial,sans-serif;color:#252525;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fff;border-radius:12px;padding:32px;">
      <tr><td align="center"><h1 style="margin:0;color:#2e7d32;font-size:30px;">🥬 KeepFresh</h1><p style="color:#666;">A message for your household</p></td></tr>
      <tr><td><h2>Hello {{user_name}},</h2><p style="line-height:1.6;">There is a new announcement from KeepFresh:</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0;background:#eef6ee;border-left:5px solid #2e7d32;border-radius:6px;"><tr><td style="padding:18px 20px;">
          <p style="margin:0 0 10px;color:#2e7d32;font-size:13px;font-weight:bold;letter-spacing:1px;">{{alert_level}}</p>
          <p style="margin:0;font-size:17px;line-height:1.55;">{{announcement_message}}</p>
        </td></tr></table>
        <p style="line-height:1.6;">Open KeepFresh to see the latest information for your household.</p>
        <hr style="margin:26px 0;border:0;border-top:1px solid #ddd;"><p style="color:#888;font-size:12px;">© 2026 KeepFresh. All rights reserved.</p></td></tr>
    </table>
  </td></tr></table>
</body>
</html>
