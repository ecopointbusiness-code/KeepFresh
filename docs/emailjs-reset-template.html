<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KeepFresh password reset</title></head>
<body style="margin:0;padding:24px 12px;background:#f4f7f6;font-family:Arial,sans-serif;color:#252525;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fff;border-radius:12px;padding:32px;">
      <tr><td align="center"><h1 style="margin:0;color:#2e7d32;font-size:30px;">🥬 KeepFresh</h1><p style="color:#666;">Password reset request</p></td></tr>
      <tr><td><h2>Hello {{user_name}},</h2><p style="line-height:1.6;">Use this one-time code in KeepFresh to reset your password:</p>
        <div style="margin:28px 0;text-align:center;"><span style="display:inline-block;padding:15px 30px;border-radius:8px;background:#2e7d32;color:#fff;font-size:32px;font-weight:bold;letter-spacing:5px;">{{reset_code}}</span></div>
        <p>This code expires in <strong>{{validity_minutes}} minutes</strong>. If you did not request a password reset, ignore this email.</p>
        <hr style="margin:26px 0;border:0;border-top:1px solid #ddd;"><p style="color:#888;font-size:12px;">© 2026 KeepFresh. All rights reserved.</p></td></tr>
    </table>
  </td></tr></table>
</body>
</html>
