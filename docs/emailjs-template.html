<div style="background:#f8f4f0;padding:24px 12px;font-family:'Segoe UI',Arial,Helvetica,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e6dfd2">
    <div style="background:#314401;padding:22px 24px;text-align:center">
      <img src="{{logo_url}}" alt="KeepFresh" width="200" style="max-width:200px;height:auto;border-radius:12px;display:block;margin:0 auto 6px">
      <div style="font-size:22px;font-weight:800;letter-spacing:1px;color:#f8f4f0">KEEP <span style="color:#94a84e">FRESH</span></div>
    </div>
    <div style="padding:26px 24px">
      <p style="margin:0 0 14px;color:#7a7a5c;font-size:14px">Hi {{to_name}},</p>
      <p style="margin:0;font-size:17px;line-height:1.6;color:#314401">{{message}}</p>
      <div style="height:3px;width:56px;background:#ee7121;border-radius:3px;margin:24px 0 14px"></div>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#7a7a5c">Keeping freshness alive. This email was sent by {{app_name}}. If you did not expect it, you can ignore it.</p>
    </div>
  </div>
</div>
